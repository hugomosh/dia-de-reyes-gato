<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Estado de Gato - Día de Reyes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>👑</text></svg>" />
    <link rel="stylesheet" href="/src/state.css" />
  </head>

  <body>
    <!-- Star Background -->
    <div class="star-background">
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-orbital">
        <div class="orbital-container">
          <div class="orbit orbit-1">
            <div class="particle"></div>
          </div>
          <div class="orbit orbit-2">
            <div class="particle"></div>
          </div>
          <div class="orbit orbit-3">
            <div class="particle"></div>
          </div>
        </div>
        <p>Cargando tu estado único...</p>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container">
      <h1>Tu Estado Único</h1>
      <p class="subtitle">Un regalo de los Reyes Magos</p>

      <div id="state-display"></div>

      <div id="state-info" class="state-info"></div>

      <div id="claimed-info" class="claimed-by" style="display: none;">
        <h2>Reclamado por</h2>
        <p id="claimed-name"></p>
      </div>

      <a href="./" class="back-link">← Volver al cosmos completo</a>
    </div>

    <footer>
      <p>Con ♥ Hugo, with the help of 🤖.</p>
    </footer>

    <script type="module" src="/src/state.js"></script>
  </body>
</html>
